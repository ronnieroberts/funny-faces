# When a version tag (v1.2.3) is pushed, build the no-Node downloads for each system and attach them to a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [mac-arm64, mac-x64, win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/make-release.mjs --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "${{ github.ref_name }}" in *-*) flag="--prerelease" ;; esac   # v1.0.1-rc1 is a test release
          gh release create "${{ github.ref_name }}" release/*.zip --repo "${{ github.repository }}" --title "Funny Faces ${{ github.ref_name }}" --generate-notes $flag
